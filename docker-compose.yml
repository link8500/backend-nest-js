services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: backend_nestjs
      POSTGRES_PASSWORD: backend_nestjs_dev
      POSTGRES_DB: backend_nestjs
    ports:
      - "5432:5432"
    volumes:
      - backend_nestjs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_nestjs -d backend_nestjs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_nestjs_postgres_data:
